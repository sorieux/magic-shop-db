name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install lint dependencies
        run: uv sync --group lint

      - name: Lint schema
        run: uv run sqlfluff lint db/init/01_schema.sql

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set permissions on seed data
        run: chmod -R a+rx db/

      - name: Start database
        run: docker compose up -d

      - name: Wait for database to be healthy
        run: |
          echo "Waiting for database..."
          timeout 60 bash -c \
            'until docker compose exec -T db pg_isready -U harry -d magic-shop -q; do sleep 2; done'
          echo "Database is ready."

      - uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        run: uv sync --group test

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: harry
          DB_PASSWORD: potter
          DB_NAME: magic-shop

      - name: Stop database
        if: always()
        run: docker compose down -v
